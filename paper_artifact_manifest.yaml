  - CITATION.cff

  - RESEARCH_BOUNDARY.md

  - REPRODUCIBILITY.md

  - PAPER_RELEASE_READINESS.md

  - paper_artifact_manifest.yaml

  - api/openapi.yaml

  - architecture/system-design.md

  - architecture/lens-router.md

  - governance/evidence-standard.md

  - governance/privacy-and-fairness.md

  - research_core/

