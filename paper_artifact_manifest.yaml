# Frozen-paper artifact allowlist. This is intentionally narrower than public_manifest.yaml.

version: 1

paper_version: v1.4

artifact_version: anonymous-v1.4-review

release_status: anonymous_review_snapshot

branch_base_commit: prior-baseline-withheld-for-review

experimental_bundle_commit: corrective-baseline-withheld-for-review

target_release_tag: anonymous-v1.4-review

frozen_artifact_ref: anonymous-v1.4-review

previous_frozen_artifact_ref: prior-anonymous-review-snapshot

previous_frozen_commit: prior-baseline-withheld-for-review

repository: jrt-anonymous-review-artifacts/aims-lens-engine-v1-4-review

policy:

  default_action: exclude

  candidate_side_practice_only: true

  employer_selection_decisions_allowed: false

  private_data_allowed: false

  network_required_for_demo: false



